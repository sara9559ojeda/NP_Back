server {
    listen 80 default_server;
    server_name _;
    root /opt/neurophobia/frontend;
    index index.html;
    access_log off;
    server_tokens off;
    client_max_body_size 256k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-NP-Client-IP $http_x_np_client_ip;
        proxy_set_header X-NP-Proxy-Secret __PROXY_SECRET__;
        proxy_read_timeout 30s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
    }
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control no-cache; }
    location ~ /\. { deny all; }
}
