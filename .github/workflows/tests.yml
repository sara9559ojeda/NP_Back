name: tests

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: OpenAPI al día
        run: python scripts/export_openapi.py --check
      - name: Pruebas
        # Las pruebas arrancan su propio PostgreSQL efímero en Docker, con credenciales aleatorias.
        run: python -m pytest
