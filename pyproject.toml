[project]
name = "neurophobia-backend"
version = "0.1.0"
description = "API REST de NEUROPHOBIA (prototipo académico)"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "starlette==1.10.0",
  "uvicorn[standard]==0.54.0",
  "SQLAlchemy==2.1.6",
  "psycopg[binary]==3.3.6",
  "alembic==1.20.1",
  "pydantic==2.14.2",
  "pydantic-settings==2.16.2",
  "email-validator==2.3.0",
  "argon2-cffi==25.1.0",
  "PyJWT==2.15.1",
  "httpx==0.28.1",
]

[tool.vercel]
entrypoint = "main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
